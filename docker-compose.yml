services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: liteshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liteshop_dev
      POSTGRES_USER: liteshop
      POSTGRES_PASSWORD: liteshop
    ports: ['5432:5432']
    volumes: ['liteshop-postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liteshop -d liteshop_dev']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: liteshop-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['liteshop-redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  liteshop-postgres-data:
  liteshop-redis-data:
