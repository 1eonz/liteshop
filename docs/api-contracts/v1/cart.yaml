openapi: 3.0.3
info: {title: LiteShop Cart API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /cart: {get: {security: [{bearerAuth: []}], responses: {'200': {description: Cart items}}}}
  /cart/items: {post: {security: [{bearerAuth: []}], parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartItemInput'}}}}, responses: {'200': {description: Added}}}}
  /cart/items/{id}: {put: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Updated}}}, delete: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Removed}}}}
components: {securitySchemes: {bearerAuth: {type: http, scheme: bearer}}, schemas: {CartItemInput: {type: object, required: [skuId, quantity, priceCents], properties: {skuId: {type: integer}, quantity: {type: integer, minimum: 1}, priceCents: {type: integer, minimum: 0, description: Amount in cents}}}}}
