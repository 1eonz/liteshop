openapi: 3.0.3
info: {title: LiteShop Favorite API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /favorites:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Favorite product IDs}}}
  /favorites/{productId}:
    put: {security: [{bearerAuth: []}], parameters: [{in: path, name: productId, required: true, schema: {type: integer, minimum: 1}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Updated favorite state}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
