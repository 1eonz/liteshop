openapi: 3.0.3
info: {title: LiteShop User API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /user/me: {get: {security: [{bearerAuth: []}], responses: {'200': {description: User profile}}}}
  /user/addresses: {get: {security: [{bearerAuth: []}], responses: {'200': {description: Address list}}}, post: {security: [{bearerAuth: []}], parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}, responses: {'200': {description: Address created}}}}
  /user/addresses/{addressId}: {put: {security: [{bearerAuth: []}], parameters: [{in: path, name: addressId, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}, responses: {'200': {description: Address updated}}}, delete: {security: [{bearerAuth: []}], parameters: [{in: path, name: addressId, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Address deleted}}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    AddressInput: {type: object, required: [receiverName, phone, provinceCode, cityCode, districtCode, detail], properties: {receiverName: {type: string}, phone: {type: string}, provinceCode: {type: string}, cityCode: {type: string}, districtCode: {type: string}, detail: {type: string}, isDefault: {type: boolean}}}
