openapi: 3.0.3
info: {title: LiteShop Auth API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /auth/sms-code: {post: {summary: Send SMS code, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SmsCodeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/Ok'}}}}
  /auth/sms/send: {post: {summary: Compatibility path for sending SMS code, deprecated: true, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SmsCodeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/Ok'}}}}
  /auth/login: {post: {summary: Login, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}, responses: {'200': {$ref: '#/components/responses/Ok'}}}}
  /auth/refresh: {post: {summary: Refresh token, responses: {'200': {$ref: '#/components/responses/Ok'}}}}
  /auth/logout: {post: {summary: Logout, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/Ok'}}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    SmsCodeRequest: {type: object, required: [phone], properties: {phone: {type: string}, purpose: {type: string}}}
    LoginRequest: {type: object, required: [phone, code], properties: {phone: {type: string}, code: {type: string}}}
    Envelope: {type: object, properties: {code: {type: integer, example: 0}, data: {}, requestId: {type: string}}}
  responses:
    Ok: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
