openapi: 3.0.3
info: {title: LiteShop Website Navigation API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /site/navigation:
    get:
      parameters:
        - {in: query, name: location, required: false, schema: {type: string, enum: [header, footer]}}
      responses: {'200': {description: Enabled navigation items}}
  /admin/navigation:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: All navigation items}}}
    post:
      security: [{bearerAuth: []}]
      parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NavigationItem'}}}}
      responses: {'201': {description: Created}}
  /admin/navigation/{itemId}:
    parameters: [{in: path, name: itemId, required: true, schema: {type: integer, minimum: 1}}]
    put:
      security: [{bearerAuth: []}]
      parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NavigationItem'}}}}
      responses: {'200': {description: Updated}}
    delete:
      security: [{bearerAuth: []}]
      parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Deleted}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    NavigationItem: {type: object, required: [label, href, location, kind], properties: {label: {type: string}, href: {type: string}, location: {type: string, enum: [header, footer]}, kind: {type: string, enum: [internal, external, anchor]}, openNewTab: {type: boolean}, sortOrder: {type: integer}, enabled: {type: boolean}}}
