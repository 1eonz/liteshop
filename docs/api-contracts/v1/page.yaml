openapi: 3.0.3
info: {title: LiteShop Page API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /site/pages/{slug}:
    get:
      parameters: [{in: path, name: slug, required: true, schema: {type: string, pattern: '^[a-z0-9-]+$'}}]
      responses: {'200': {description: Published page schema, content: {application/json: {schema: {$ref: '#/components/schemas/PageSchema'}}}}, '404': {description: Page not found}}
  /pages:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Page management list, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/PageSummary'}}}}}}}}}
    post:
      security: [{bearerAuth: []}]
      parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PageSchema'}}}}
      responses: {'201': {description: Created}}
  /pages/{id}/schema: {get: {parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Versioned page schema, content: {application/json: {schema: {$ref: '#/components/schemas/PageSchema'}}}}}}}
  /pages/{id}/copy:
    post:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [slug], properties: {slug: {type: string, pattern: '^[a-z0-9-]+$'}, name: {type: string}}}}}}
      responses: {'201': {description: Copied}}
  /pages/{id}:
    delete:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Deleted}}
  /pages/{id}/variants:
    get: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: A/B variants}}}
  /pages/{id}/variants/{variantKey}:
    put:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: path, name: variantKey, required: true, schema: {type: string}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [key, name, schema], properties: {key: {type: string}, name: {type: string}, allocationPercent: {type: integer, minimum: 0, maximum: 100}, schema: {$ref: '#/components/schemas/PageSchema'}, enabled: {type: boolean}}}}}}
      responses: {'200': {description: Saved}}
  /pages/{id}/events:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [eventName], properties: {eventName: {type: string}, variantKey: {type: string}, anonymousId: {type: string}, metadata: {type: object}}}}}}
      responses: {'202': {description: Accepted}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    PageSummary: {type: object, required: [id, slug, name, version, isHome], properties: {id: {type: integer}, slug: {type: string}, name: {type: string}, version: {type: integer}, isHome: {type: boolean}, updatedAt: {type: string, format: date-time}}}
    PageSchema: {type: object, required: [id, version, components], properties: {id: {type: integer}, version: {type: integer}, slug: {type: string}, components: {type: array, items: {type: object}}}}
