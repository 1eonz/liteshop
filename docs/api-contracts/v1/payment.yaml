openapi: 3.0.3
info: {title: LiteShop Payment API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /payments: {post: {security: [{bearerAuth: []}], parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentCreate'}}}}, responses: {'200': {description: Payment parameters}, '409': {description: Amount mismatch}}}}
  /payments/{paymentId}/refund: {post: {summary: Create a refund request, security: [{bearerAuth: []}], parameters: [{in: path, name: paymentId, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundCreate'}}}}, responses: {'200': {description: Refund request}, '409': {description: Refund validation failed}}}}
  /payments/wechat/callback: {post: {summary: Verify and process WeChat callback, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'200': {description: Idempotent success}}}}
  /payments/alipay/callback: {post: {summary: Verify and process Alipay callback, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'200': {description: Idempotent success}}}}
  /payments/callback: {post: {summary: Compatibility callback path (WeChat sandbox), requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentCallback'}}}}, responses: {'200': {description: Idempotent success}, '409': {description: Signature, amount, or state validation failed}}}}
components: {securitySchemes: {bearerAuth: {type: http, scheme: bearer}}, schemas: {PaymentCreate: {type: object, required: [orderId, provider, amountCents], properties: {orderId: {type: integer}, provider: {type: string, enum: [WECHAT, ALIPAY]}, amountCents: {type: integer, minimum: 0, description: Amount in cents}}}, PaymentCallback: {type: object, required: [orderId, callbackId, amountCents, signature, providerTradeNo], properties: {orderId: {type: integer, minimum: 1}, callbackId: {type: string, minLength: 1}, amountCents: {type: integer, minimum: 0, description: Amount in cents}, signature: {type: string, minLength: 1}, providerTradeNo: {type: string, minLength: 1}}}, RefundCreate: {type: object, required: [amountCents], properties: {amountCents: {type: integer, minimum: 1, description: Amount in cents}, reason: {type: string, maxLength: 500, default: 用户申请退款}}}, RefundResponse: {type: object, required: [id, refundNo, amountCents, status], properties: {id: {type: integer}, refundNo: {type: string}, amountCents: {type: integer}, status: {type: string, enum: [PENDING, SUCCESS, FAILED]}}}}}
