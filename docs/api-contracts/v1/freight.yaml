openapi: 3.0.3
info: {title: LiteShop Freight API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /orders/freight-calc: {post: {summary: Calculate freight from server SKU weights, security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FreightCalculateRequest'}}}}, responses: {'200': {description: Freight amount in cents, content: {application/json: {schema: {$ref: '#/components/schemas/FreightCalculateResponse'}}}}, '409': {description: Product price or freight rule conflict}}}}
  /admin/freight-templates: {get: {summary: List freight templates, security: [{bearerAuth: []}], responses: {'200': {description: Freight template list}}}, post: {summary: Create freight template, security: [{bearerAuth: []}], parameters: [{in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FreightTemplateCreate'}}}}, responses: {'200': {description: Created}}}}
  /admin/freight-templates/{id}: {put: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FreightTemplateUpdate'}}}}, responses: {'200': {description: Updated}}}, delete: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Deleted}}}}
  /admin/freight-templates/{id}/items: {post: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FreightTemplateItemCreate'}}}}, responses: {'200': {description: Added}}}}
  /admin/freight-templates/{id}/items/{itemId}: {put: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: path, name: itemId, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Updated}}}, delete: {security: [{bearerAuth: []}], parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: path, name: itemId, required: true, schema: {type: integer}}, {in: header, name: X-Request-Id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Deleted}}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    FreightLine: {type: object, required: [skuId, quantity], properties: {skuId: {type: integer, minimum: 1}, quantity: {type: integer, minimum: 1}}}
    FreightCalculateRequest: {type: object, required: [items, provinceCode, productAmount], properties: {items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/FreightLine'}}, provinceCode: {type: string}, productAmount: {type: integer, minimum: 0, description: Amount in cents}, templateId: {type: integer}}}
    FreightCalculateResponse: {type: object, required: [freightAmount], properties: {freightAmount: {type: integer, minimum: 0, description: Amount in cents}}}
    FreightTemplateItemCreate: {type: object, required: [firstUnit, firstFee, additionalUnit, additionalFee], properties: {regionCodes: {type: array, items: {type: string}}, firstUnit: {type: number, exclusiveMinimum: 0}, firstFee: {type: integer, minimum: 0}, additionalUnit: {type: number, exclusiveMinimum: 0}, additionalFee: {type: integer, minimum: 0}, freeCondition: {type: object}}}
    FreightTemplateCreate: {type: object, required: [name, type], properties: {name: {type: string}, type: {type: string, enum: [WEIGHT, PIECE, REGION]}, isDefault: {type: boolean}, enabled: {type: boolean}, items: {type: array, items: {$ref: '#/components/schemas/FreightTemplateItemCreate'}}}}
    FreightTemplateUpdate: {type: object, properties: {name: {type: string}, type: {type: string, enum: [WEIGHT, PIECE, REGION]}, isDefault: {type: boolean}, enabled: {type: boolean}}}
