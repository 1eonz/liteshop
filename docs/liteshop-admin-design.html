<head>
  <meta charset="utf-8" />

  <title>LiteShop Admin Design</title>
  <style>
    :root{--coral:#ff6b6b;--coral-dark:#c93030;--coral-soft:#fff1f1;--ink:#203236;--muted:#718083;--line:#e6eeee;--page:#f5f7f7;--surface:#fff;--success:#237804;--warning:#ad6800;--danger:#cf1322;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:6px}*{box-sizing:border-box}body{margin:0;min-width:1180px;color:var(--ink);background:var(--page);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #ffa3a3;outline-offset:2px}.shell{display:grid;grid-template-columns:220px minmax(960px,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:28px 14px;background:#fff;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;margin:0 10px 34px;color:var(--coral-dark);font-size:20px;font-weight:800}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:9px;background:var(--coral);color:#fff}.nav-label{margin:20px 10px 8px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}.nav{display:block;width:100%;padding:11px 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);text-align:left}.nav:hover,.nav[aria-current="page"]{background:var(--coral-soft);color:var(--coral-dark);font-weight:700}.content{width:min(1180px,calc(100% - 64px));margin:0 auto;padding:32px 0 60px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.crumb{margin:0;color:var(--muted);font-size:13px}.page-head h1{margin:4px 0 0;font-size:30px;line-height:1.2}.primary,.secondary,.danger{min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:6px;font-weight:700}.primary{background:var(--coral);color:#fff}.primary:hover{background:#e54545}.primary:disabled{color:#999;background:#ffe0e0;cursor:not-allowed}.secondary{border-color:var(--line);background:#fff;color:var(--ink)}.secondary:hover{border-color:#ff8080;color:var(--coral-dark)}.danger{border-color:#ffccc7;background:#fff2f0;color:var(--danger)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric,.panel{border:1px solid var(--line);border-radius:6px;background:#fff}.metric{padding:16px}.metric span,.metric small{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin:10px 0 4px;font-size:28px;font-variant-numeric:tabular-nums}.metric em{color:var(--success);font-size:12px;font-style:normal}.panel{margin-top:16px;padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.panel-head h2{margin:0;font-size:16px}.panel-head span{color:var(--muted);font-size:12px}.dashboard-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.chart{display:flex;height:230px;align-items:end;gap:22px;padding:18px 12px 22px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 45px,#eef3f3 46px)}.chart div{display:grid;flex:1;height:100%;align-items:end}.chart i{display:block;border-radius:5px 5px 0 0;background:var(--coral);opacity:.88}.chart b{margin-top:8px;color:var(--muted);font-size:11px;text-align:center}.rank,.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rank:last-child,.todo:last-child{border-bottom:0}.rank b{display:grid;width:24px;height:24px;place-items:center;border-radius:50%;background:var(--coral-soft);color:var(--coral-dark)}.rank span{flex:1}.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;color:var(--muted);background:#f5f7f7;font-size:12px;font-weight:700}.badge.success{color:var(--success);background:#f0fff0}.badge.warning{color:var(--warning);background:#fffbe6}.badge.danger{color:var(--danger);background:#fff2f0}.toolbar{display:flex;align-items:end;gap:12px;margin-bottom:12px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);outline:0}.field textarea{min-height:94px;padding:10px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px #ffe0e0}.grow{flex:1}.status{margin:0 0 12px;color:var(--muted);font-size:13px}.table{width:100%;border-collapse:collapse;background:#fff}.table th{padding:10px 12px;background:#fafafa;color:var(--muted);font-size:12px;font-weight:700;text-align:left}.table td{height:56px;padding:8px 12px;border-bottom:1px solid var(--line)}.table tr:hover td{background:#fafcfc}.table a{color:inherit;text-decoration:none}.action-row{display:flex;gap:8px;align-items:center}.action-link{padding:4px;border:0;background:transparent;color:var(--coral-dark);font-weight:700}.form{display:grid;gap:16px;max-width:920px;padding:24px;border:1px solid var(--line);border-radius:6px;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form h2{margin:8px 0 0;font-size:16px}.footer-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:6px}.info{padding:10px 12px;border-radius:4px;color:#0050b3;background:#e6f7ff}.success{padding:10px 12px;border-radius:4px;color:var(--success);background:#f0fff0}.error{padding:10px 12px;border-radius:4px;color:var(--danger);background:#fff2f0}.empty{display:grid;min-height:260px;place-content:center;justify-items:center;color:var(--muted);text-align:center}.empty b{display:grid;width:64px;height:64px;place-items:center;margin-bottom:12px;border-radius:50%;background:var(--coral-soft);color:var(--coral-dark);font-size:28px}.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#f5f7f7;border-radius:4px}.inline input{width:130px}.split{display:grid;grid-template-columns:1fr .8fr;gap:16px}.switch{display:flex;align-items:center;gap:8px}.switch input{width:38px;height:22px;accent-color:var(--coral)}.builder{display:grid;grid-template-columns:200px 1fr 250px;min-height:560px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.builder aside{padding:14px;border-right:1px solid var(--line)}.builder main{padding:20px;background:#f5f7f7}.builder section{padding:14px;border-left:1px solid var(--line)}.palette{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);text-align:left}.phone-preview{width:300px;min-height:430px;margin:auto;padding:14px;border:7px solid var(--ink);border-radius:26px;background:#fff}.preview-block{height:70px;margin-bottom:10px;border-radius:8px;background:#fff1f1}.preview-block:nth-child(2){height:48px;background:#f5f7f7}.preview-block:nth-child(3){height:160px;background:#d9e6f1}.login-wrap{display:grid;min-height:100vh;place-items:center;background:#f5f7f7}.login{width:440px;padding:32px;border:1px solid var(--line);border-radius:6px;background:#fff}.login h1{margin:0;font-size:26px}.login .field{margin-top:16px}.login .primary{width:100%;margin-top:20px}.toast{position:fixed;top:20px;right:24px;z-index:4;padding:12px 16px;border-radius:6px;color:var(--success);background:#f0fff0;box-shadow:0 8px 24px rgb(32 50 54 / 14%)}
    /* Preview only: retain opaque data surfaces; glass is limited to shell and controls. */
    :root { --glass-surface:rgb(255 255 255 / 70%); --glass-surface-strong:rgb(255 255 255 / 86%); --glass-border:rgb(255 255 255 / 78%); --glass-blur:16px; --glass-shadow:0 12px 28px rgb(32 50 54 / 8%), inset 0 1px 0 rgb(255 255 255 / 66%); }
    .sidebar { background:var(--glass-surface-strong); border-right-color:var(--glass-border); box-shadow:1px 0 0 rgb(32 50 54 / 4%); backdrop-filter:blur(var(--glass-blur)); }
    .page-head { position:sticky; top:16px; z-index:2; padding:14px 16px; border:1px solid var(--glass-border); border-radius:8px; background:var(--glass-surface); box-shadow:0 8px 24px rgb(32 50 54 / 5%); backdrop-filter:blur(var(--glass-blur)); }
    .toolbar { padding:12px; border:1px solid var(--glass-border); border-radius:6px; background:var(--glass-surface); box-shadow:0 6px 16px rgb(32 50 54 / 4%); backdrop-filter:blur(var(--glass-blur)); }
    .inline { border:1px solid var(--glass-border); background:var(--glass-surface); backdrop-filter:blur(var(--glass-blur)); }
    .login { border-color:var(--glass-border); background:var(--glass-surface-strong); box-shadow:var(--glass-shadow); backdrop-filter:blur(22px); }
    .toast { border:1px solid var(--glass-border); background:rgb(240 255 240 / 86%); box-shadow:var(--glass-shadow); backdrop-filter:blur(var(--glass-blur)); }
    /* Deep preview treatment: glass shell, opaque work surfaces for scanability. */
    body { background:radial-gradient(760px 420px at 88% 4%,rgb(255 107 107 / 13%),transparent 70%),radial-gradient(680px 520px at 18% 92%,rgb(44 185 176 / 12%),transparent 72%),linear-gradient(145deg,#f7fbfa 0%,#e9f1f0 58%,#dfe9e8 100%); }
    .shell { position:relative; isolation:isolate; }
    .shell::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(760px 420px at 88% 4%,rgb(255 107 107 / 13%),transparent 70%),radial-gradient(680px 520px at 18% 92%,rgb(44 185 176 / 12%),transparent 72%),linear-gradient(145deg,#f7fbfa 0%,#e9f1f0 58%,#dfe9e8 100%); }
    .sidebar { background:linear-gradient(180deg,rgb(255 255 255 / 88%),rgb(255 255 255 / 68%)); box-shadow:12px 0 34px rgb(32 50 54 / 8%), inset -1px 0 0 rgb(255 255 255 / 82%); -webkit-backdrop-filter:blur(22px) saturate(125%); backdrop-filter:blur(22px) saturate(125%); }
    .brand .mark { box-shadow:0 8px 18px rgb(201 48 48 / 22%), inset 0 1px 0 rgb(255 255 255 / 45%); }
    .nav { transition:background .2s ease, transform .2s ease; }
    .nav:hover { transform:translateX(2px); }
    .nav[aria-current="page"] { box-shadow:inset 3px 0 0 var(--coral), 0 6px 14px rgb(201 48 48 / 8%); }
    .content { position:relative; }
    .page-head { background:linear-gradient(135deg,rgb(255 255 255 / 80%),rgb(255 255 255 / 58%)); box-shadow:0 14px 32px rgb(32 50 54 / 8%), inset 0 1px 0 rgb(255 255 255 / 88%); -webkit-backdrop-filter:blur(20px) saturate(125%); backdrop-filter:blur(20px) saturate(125%); }
    .toolbar { background:linear-gradient(135deg,rgb(255 255 255 / 72%),rgb(255 255 255 / 52%)); box-shadow:0 10px 24px rgb(32 50 54 / 6%), inset 0 1px 0 rgb(255 255 255 / 82%); -webkit-backdrop-filter:blur(18px) saturate(120%); backdrop-filter:blur(18px) saturate(120%); }
    .metric,.panel,.form,.builder,.login { box-shadow:0 8px 20px rgb(32 50 54 / 6%), inset 0 1px 0 rgb(255 255 255 / 62%); }
    .inline { box-shadow:inset 0 1px 0 rgb(255 255 255 / 74%); }
    .toast { box-shadow:0 16px 34px rgb(32 50 54 / 16%), inset 0 1px 0 rgb(255 255 255 / 76%); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
    @supports not ((backdrop-filter: blur(1px))) { .sidebar,.page-head,.toolbar,.toast { background:#fff; } }
    .quick-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.quick-action{display:grid;gap:7px;min-height:108px;align-content:center;justify-items:center;padding:14px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-align:center;box-shadow:0 8px 20px rgb(32 50 54 / 5%)}.quick-action b{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;background:var(--coral-soft);color:var(--coral-dark);font-size:18px}.quick-action span{font-size:12px;font-weight:700}.quick-action small{color:var(--muted);font-size:11px}.quick-action:hover{border-color:#ffb4b4;transform:translateY(-1px)}.todo strong{display:block;font-size:13px}.todo-copy{flex:1}.todo-copy small{display:block;margin-top:2px;color:var(--muted)}.todo .badge{min-width:30px;justify-content:center}
  </style>
</head>
<body>
  <main class="shell"><nav class="sidebar" aria-label="后台页面"><div class="brand"><span class="mark">L</span> LiteShop</div><p class="nav-label">运营</p><button class="nav" data-page="dashboard">数据看板</button><p class="nav-label">商品中心</p><button class="nav" data-page="products">商品管理</button><button class="nav" data-page="editor">新建 / 编辑商品</button><button class="nav" data-page="categories">分类管理</button><button class="nav" data-page="reviews">评价审核</button><p class="nav-label">订单与履约</p><button class="nav" data-page="orders">订单管理</button><button class="nav" data-page="inventory">库存管理</button><button class="nav" data-page="freight">运费模板</button><button class="nav" data-page="afterSales">售后管理</button><p class="nav-label">商城与系统</p><button class="nav" data-page="builder">页面搭建器</button><button class="nav" data-page="members">会员管理</button><button class="nav" data-page="settings">系统设置</button><button class="nav" data-page="audit">审计与权限</button><button class="nav" data-page="contact">联系表单</button><p class="nav-label">账户</p><button class="nav" data-page="login">管理员登录</button></nav><section class="content" id="app"></section></main>
  <script>
    const head=(crumb,title,action='')=>`<header class="page-head"><div><p class="crumb">${crumb}</p><h1>${title}</h1></div>${action}</header>`;
    const productRows=()=>`<table class="table"><thead><tr><th>商品</th><th>状态</th><th>价格区间</th><th>销量</th><th>操作</th></tr></thead><tbody><tr><td><b>晨光玻璃水杯</b><br><small class="muted">SPU-10001</small></td><td><span class="badge success">已上架</span></td><td>¥89.00</td><td>1,204</td><td><button class="action-link" data-page="editor">编辑 →</button></td></tr><tr><td><b>简约通勤托特包</b><br><small class="muted">SPU-10002</small></td><td><span class="badge success">已上架</span></td><td>¥168.00</td><td>856</td><td><button class="action-link" data-page="editor">编辑 →</button></td></tr><tr><td><b>柔软纯棉毛巾</b><br><small class="muted">SPU-10003</small></td><td><span class="badge">草稿</span></td><td>¥39.00</td><td>0</td><td><button class="action-link" data-page="editor">继续编辑 →</button></td></tr></tbody></table>`;
    const pages={
      dashboard:()=>`${head('运营中心','数据看板','<button class="secondary" data-action="导出报表">导出报表</button>')}<section class="metric-grid"><article class="metric"><span>今日销售额</span><b>¥12,680</b><em>实时聚合</em></article><article class="metric"><span>支付订单</span><b>86</b><small>累计订单</small></article><article class="metric"><span>在售商品</span><b>128</b><small>商品总量</small></article><article class="metric"><span>待发货</span><b>12</b><em>需处理</em></article></section><section class="panel"><div class="panel-head"><h2>快捷操作</h2><span>高频运营任务</span></div><div class="quick-actions"><button class="quick-action" data-page="editor"><b>＋</b><span>新建商品</span><small>快速发布</small></button><button class="quick-action" data-page="orders"><b>□</b><span>订单发货</span><small>12 待处理</small></button><button class="quick-action" data-page="inventory"><b>⌁</b><span>库存盘点</span><small>3 项预警</small></button><button class="quick-action" data-page="builder"><b>◫</b><span>装修首页</span><small>编辑发布</small></button><button class="quick-action" data-page="audit"><b>◌</b><span>审计记录</span><small>5 项待看</small></button></div></section><section class="dashboard-grid"><article class="panel"><div class="panel-head"><h2>销售趋势</h2><span>近 7 天</span></div><div class="chart">${[44,64,52,81,62,96,76].map((h,i)=>`<div><i style="height:${h}%"></i><b>${['周四','周五','周六','周日','周一','周二','今天'][i]}</b></div>`).join('')}</div></article><article class="panel"><div class="panel-head"><h2>待办提醒</h2><span class="badge danger">3 项紧急</span></div><div class="todo"><span class="badge warning">12</span><div class="todo-copy"><strong>待发货订单</strong><small>最早一单已等待 42 分钟</small></div><button class="action-link" data-page="orders">处理</button></div><div class="todo"><span class="badge danger">3</span><div class="todo-copy"><strong>低库存 SKU</strong><small>建议优先补货，避免超卖</small></div><button class="action-link" data-page="inventory">查看</button></div><div class="todo"><span class="badge">5</span><div class="todo-copy"><strong>待审计事项</strong><small>含 2 项价格调整记录</small></div><button class="action-link" data-page="audit">查看</button></div></article></section><article class="panel"><div class="panel-head"><h2>商品排行</h2><span>按销量</span></div>${['晨光玻璃水杯','简约通勤托特包','柔软纯棉毛巾'].map((x,i)=>`<div class="rank"><b>${i+1}</b><span>${x}</span><strong>${[1204,856,622][i]} 件</strong></div>`).join('')}</article>`,
      products:()=>`${head('商品中心','商品管理','<button class="primary" data-page="editor">新建商品</button>')}<div class="toolbar"><label class="field grow">搜索商品<input placeholder="名称关键词" /></label><button class="secondary" data-action="商品列表已刷新">刷新</button></div><p class="status">当前显示 3 件商品</p><section class="panel" style="padding:0;overflow:hidden">${productRows()}</section>`,
      editor:()=>`${head('商品中心','新建商品','<button class="primary" data-action="商品已保存">保存商品</button>')}<form class="form"><div class="form-grid"><label class="field">商品名称<input value="晨光玻璃水杯" /></label><label class="field">品牌<input placeholder="选填" /></label></div><label class="field">商品副标题<input value="耐热高硼硅玻璃，通勤与居家都适合" /></label><label class="field">商品描述<textarea>简洁通透的日常器物，适合盛放咖啡、花茶与冷饮。</textarea></label><label class="field">发布状态<select><option>已上架</option><option>草稿</option><option>已下架</option></select></label><h2>首个 SKU</h2><div class="form-grid"><label class="field">SKU 编码<input value="CUP-300-CLEAR" /></label><label class="field">SKU 名称<input value="300ml · 透明" /></label><label class="field">价格（分）<input value="8900" inputmode="numeric" /></label><label class="field">实物库存<input value="28" inputmode="numeric" /></label></div><h2>SKU 规格</h2><table class="table"><thead><tr><th>规格</th><th>编码</th><th>价格（分）</th><th>可售库存</th></tr></thead><tbody><tr><td>300ml · 透明</td><td>CUP-300-CLEAR</td><td>8900</td><td>28</td></tr><tr><td>450ml · 琥珀</td><td>CUP-450-AMBER</td><td>9900</td><td>9</td></tr></tbody></table><div class="success">已保存 · 金额统一以整数分维护</div><div class="footer-actions"><button type="button" class="secondary">取消</button><button type="button" class="primary" data-action="商品已保存">保存商品</button></div></form>`,
      categories:()=>`${head('商品中心','分类管理')}<section class="panel"><div class="toolbar"><label class="field grow">新增分类<input placeholder="输入分类名称" /></label><button class="primary" data-action="分类已新增">新增分类</button></div><table class="table"><thead><tr><th>名称</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>${[['新品',1,'启用'],['家居',2,'启用'],['服饰',3,'启用'],['数码',4,'停用']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="badge ${x[2]==='启用'?'success':''}">${x[2]}</span></td><td><button class="action-link">重命名</button><button class="action-link">${x[2]==='启用'?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></section>`,

    let active='dashboard';function render(name){active=name;document.getElementById('app').innerHTML=pages[name]();document.querySelectorAll('.nav').forEach(x=>x.setAttribute('aria-current',x.dataset.page===name?'page':'false'))}function toast(text){const t=document.createElement('div');t.className='toast';t.textContent='✓ '+text;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)render(p.dataset.page);const a=e.target.closest('[data-action]');if(a){a.disabled=true;const old=a.textContent;a.textContent='处理中…';setTimeout(()=>{a.disabled=false;a.textContent=old;toast(a.dataset.action)},500)}const ex=e.target.closest('[data-expand]');if(ex){const kind=ex.dataset.expand;if(kind==='ship')document.getElementById('orderExpand').innerHTML='<div class="inline"><b>物流单号</b><input placeholder="请输入物流单号" /><button class="primary" data-action="已确认发货">确认发货</button></div>';if(kind==='note')document.getElementById('orderExpand').innerHTML='<div class="inline"><b>备注 / 改价</b><input placeholder="订单备注" /><input placeholder="改后金额（分）" /><button class="primary" data-action="订单已更新">保存</button></div>';if(kind==='adjust')document.getElementById('inventoryExpand').innerHTML='<div class="inline"><b>库存调整</b><input placeholder="± 数量" /><input placeholder="调整原因" /><button class="primary" data-action="库存已调整">保存</button><button class="secondary">取消</button></div>';if(kind==='ledger')document.getElementById('inventoryExpand').innerHTML='<div class="panel" style="margin:12px"><div class="panel-head"><h2>库存流水</h2><span>SKU CUP-450-AMBER</span></div><div class="todo"><b>手动调整</b><span class="grow muted">盘点修正</span><span>+12</span><small class="muted">今天 10:24</small></div><div class="todo"><b>订单锁定</b><span class="grow muted">LS202609100102</span><span>-1</span><small class="muted">昨天</small></div></div>'}});render('dashboard');
