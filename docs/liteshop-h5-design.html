    /* Preview only: glass is reserved for navigation and transient action surfaces. */
    :root { --glass-surface:rgb(255 255 255 / 68%); --glass-surface-strong:rgb(255 255 255 / 84%); --glass-border:rgb(255 255 255 / 76%); --glass-blur:16px; --glass-shadow:0 12px 30px rgb(32 50 54 / 11%), inset 0 1px 0 rgb(255 255 255 / 66%); }
    .rail { background:var(--glass-surface-strong); border-right-color:var(--glass-border); box-shadow:1px 0 0 rgb(32 50 54 / 4%); backdrop-filter:blur(var(--glass-blur)); }
    .route:hover,.route[aria-current="page"] { background:rgb(255 241 241 / 72%); }
    .stage { background:linear-gradient(145deg,#f8fbfb 0,#eef5f4 55%,#e7eeee 100%); }
    .device { background:linear-gradient(150deg,#f7fbfb,#eef4f3); }
    .top,.tabbar,.fixed-actions,.checkout { background:var(--glass-surface-strong); border-color:var(--glass-border); box-shadow:0 8px 24px rgb(32 50 54 / 6%); backdrop-filter:blur(var(--glass-blur)); }
    .hero { border:1px solid var(--glass-border); background:linear-gradient(135deg,rgb(255 241 241 / 78%),rgb(247 226 216 / 58%)); box-shadow:var(--glass-shadow); backdrop-filter:blur(var(--glass-blur)); }
    .sheet { border:1px solid var(--glass-border); background:var(--glass-surface-strong); box-shadow:var(--glass-shadow); backdrop-filter:blur(22px); }
    /* Deep preview treatment: create a visible color field behind translucent surfaces. */
    body { background:radial-gradient(720px 420px at 72% 12%,rgb(255 107 107 / 18%),transparent 68%),radial-gradient(620px 480px at 22% 82%,rgb(44 185 176 / 16%),transparent 70%),linear-gradient(145deg,#f4f9f8 0%,#e7f0ef 54%,#dbe7e6 100%); }
    .workspace { position:relative; isolation:isolate; }
    .workspace::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(720px 420px at 72% 12%,rgb(255 107 107 / 18%),transparent 68%),radial-gradient(620px 480px at 22% 82%,rgb(44 185 176 / 16%),transparent 70%),linear-gradient(145deg,#f4f9f8 0%,#e7f0ef 54%,#dbe7e6 100%); }
    .rail { position:sticky; z-index:2; background:linear-gradient(180deg,rgb(255 255 255 / 82%),rgb(255 255 255 / 64%)); box-shadow:10px 0 35px rgb(32 50 54 / 8%), inset -1px 0 0 rgb(255 255 255 / 74%); -webkit-backdrop-filter:blur(22px) saturate(125%); backdrop-filter:blur(22px) saturate(125%); }
    .rail-head .mark { box-shadow:0 8px 18px rgb(201 48 48 / 24%), inset 0 1px 0 rgb(255 255 255 / 42%); }
    .route { position:relative; transition:background .2s ease, transform .2s ease, color .2s ease; }
    .route:hover { transform:translateX(2px); }
    .route[aria-current="page"] { box-shadow:inset 3px 0 0 var(--coral), 0 6px 16px rgb(201 48 48 / 9%); }
    .stage { position:relative; overflow:hidden; background:transparent; }
    .stage::after { content:""; position:absolute; width:520px; height:520px; border-radius:50%; right:-220px; bottom:-220px; pointer-events:none; background:radial-gradient(circle,rgb(44 185 176 / 14%),transparent 68%); filter:blur(2px); }
    .device { border-color:#203236; background:linear-gradient(155deg,#f9fcfb,#eaf3f1); box-shadow:0 30px 80px rgb(32 50 54 / 28%), 0 0 0 1px rgb(255 255 255 / 72%), inset 0 0 0 1px rgb(255 255 255 / 18%); }
    .screen { background:linear-gradient(180deg,rgb(255 255 255 / 18%),transparent 32%); }
    .top,.tabbar,.fixed-actions,.checkout { background:linear-gradient(180deg,rgb(255 255 255 / 88%),rgb(255 255 255 / 70%)); box-shadow:0 -10px 30px rgb(32 50 54 / 7%), inset 0 1px 0 rgb(255 255 255 / 90%); -webkit-backdrop-filter:blur(20px) saturate(135%); backdrop-filter:blur(20px) saturate(135%); }
    .hero { position:relative; overflow:hidden; background:linear-gradient(135deg,rgb(255 241 241 / 88%),rgb(247 226 216 / 66%) 55%,rgb(255 255 255 / 48%)); box-shadow:0 18px 34px rgb(201 48 48 / 12%), inset 0 1px 0 rgb(255 255 255 / 86%); -webkit-backdrop-filter:blur(18px) saturate(125%); backdrop-filter:blur(18px) saturate(125%); }
    .hero::after { content:""; position:absolute; width:180px; height:180px; right:-70px; top:-80px; border-radius:50%; background:rgb(255 255 255 / 32%); filter:blur(4px); pointer-events:none; }
    .activity { box-shadow:0 16px 30px rgb(44 185 176 / 18%), inset 0 1px 0 rgb(255 255 255 / 28%); }
    .card,.form-card { box-shadow:0 8px 20px rgb(32 50 54 / 7%), inset 0 1px 0 rgb(255 255 255 / 72%); }
    .sheet { background:linear-gradient(180deg,rgb(255 255 255 / 92%),rgb(255 255 255 / 78%)); box-shadow:0 -18px 44px rgb(32 50 54 / 20%), inset 0 1px 0 rgb(255 255 255 / 94%); -webkit-backdrop-filter:blur(24px) saturate(135%); backdrop-filter:blur(24px) saturate(135%); }
    .sheet-backdrop { background:rgb(32 50 54 / 44%); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
    @supports not ((backdrop-filter: blur(1px))) { .rail,.top,.tabbar,.fixed-actions,.checkout,.hero,.sheet { background:#fff; } }
    /* Category workspace and detail action hierarchy inspired by the reference mini-program. */
    .category-layout{display:grid;grid-template-columns:82px 1fr;height:calc(100% - 60px);min-height:620px}
    .category-rail{overflow:auto;padding:8px 0;background:rgb(244 248 247 / 72%);border-right:1px solid var(--line)}
    .category-rail button{display:block;width:100%;min-height:52px;padding:8px 4px;border:0;border-left:3px solid transparent;background:transparent;color:var(--muted);font-size:12px}
    .category-rail button.active{border-left-color:var(--teal);background:rgb(255 255 255 / 82%);color:var(--ink);font-weight:800}
    .category-content{overflow:auto;padding:12px 14px 86px}.category-content::-webkit-scrollbar{display:none}
    .category-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px;border-radius:12px;background:linear-gradient(135deg,rgb(255 241 241 / 90%),rgb(247 226 216 / 65%));box-shadow:var(--glass-shadow)}
    .category-banner h2{margin:4px 0;font-size:18px}.category-banner p{margin:0;color:var(--muted);font-size:12px}
    .category-block{scroll-margin-top:12px;margin-top:18px}.category-block h3{margin:0 0 10px;font-size:15px}.subcats{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.subcats button{flex:0 0 auto;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:12px}
    .category-content .products{gap:14px 10px}.category-content .product-image{border-radius:10px}
    .detail-gallery{position:relative;margin:0 0 16px;padding:16px 16px 0;background:linear-gradient(145deg,#f7e2d8,#fff1f1)}
    .detail-gallery .detail-visual{margin:0;min-height:260px;background:transparent}.gallery-count{position:absolute;right:24px;bottom:12px;padding:4px 8px;border-radius:999px;background:rgb(32 50 54 / 68%);color:#fff;font-size:11px}
    .detail-summary{position:relative;margin-top:-12px;padding:18px 16px 10px;border-radius:18px 18px 0 0;background:#fff;box-shadow:0 -8px 20px rgb(32 50 54 / 7%)}
    .trust-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 4px}.trust-row span{padding:5px 8px;border-radius:999px;background:#f0fff0;color:#237804;font-size:11px}
    .fixed-actions.detail-actions{display:grid;grid-template-columns:repeat(3,44px) 1fr 1fr;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));}.detail-actions .action-icon{display:grid;gap:2px;place-items:center;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:11px}.detail-actions .action-icon b{font-size:19px;font-weight:500}.detail-actions .secondary,.detail-actions .primary{padding:0 8px}.detail-actions .primary{background:var(--coral-dark)}
    @media(max-width:360px){.category-layout{grid-template-columns:72px 1fr}.fixed-actions.detail-actions{grid-template-columns:repeat(3,38px) 1fr 1fr}.detail-actions .secondary,.detail-actions .primary{font-size:12px;padding:0 4px}}
  </style>

<body>
  <main class="workspace"><nav class="rail" aria-label="H5 路由预览"><div class="rail-head"><span class="mark">L</span> LiteShop H5</div><p>商城浏览</p><button class="route" data-route="home">/ · 首页</button><button class="route" data-route="categories">/categories · 商品分类</button><button class="route" data-route="search">/search · 搜索结果</button><button class="route" data-route="product">/product/:id · 商品详情</button><p>交易</p><button class="route" data-route="cart">/cart · 购物车</button><button class="route" data-route="confirm">/order/confirm · 确认订单</button><button class="route" data-route="payment">/payment/:id · 收银台</button><button class="route" data-route="orders">/orders · 我的订单</button><button class="route" data-route="order">/orders/:id · 订单详情</button><p>我的</p><button class="route" data-route="me">/me · 个人中心</button><button class="route" data-route="login">/login · 登录</button><button class="route" data-route="addresses">/addresses · 收货地址</button><button class="route" data-route="favorites">/favorites · 我的收藏</button><button class="route" data-route="notifications">/notifications · 通知中心</button><button class="route" data-route="settings">/settings · 设置</button><button class="route" data-route="afterSales">/after-sales · 售后服务</button><button class="route" data-route="preview">/preview · 店铺预览</button></nav><section class="stage"><div class="device"><span class="route-label" id="routeLabel"></span><div class="screen" id="screen"></div><div id="overlay"></div></div></section></main>
  <script>
    (function () {
    const products = `<div class="products"><article class="product" data-go="product"><div class="product-image">L</div><h3>晨光玻璃水杯</h3><b class="price">¥89.00</b><span class="sale">已售 1.2k</span></article><article class="product" data-go="product"><div class="product-image">L</div><h3>简约通勤托特包</h3><b class="price">¥168.00</b><span class="sale">已售 856</span></article><article class="product" data-go="product"><div class="product-image">L</div><h3>柔软纯棉毛巾</h3><b class="price">¥39.00</b><span class="sale">已售 622</span></article><article class="product" data-go="product"><div class="product-image">L</div><h3>氛围感香薰蜡烛</h3><b class="price">¥69.00</b><span class="sale">已售 410</span></article></div>`;
    const tabs = (active='首页') => `<nav class="tabbar" aria-label="主导航"><button class="tab ${active==='首页'?'active':''}" data-go="home"><b>⌂</b>首页</button><button class="tab ${active==='分类'?'active':''}" data-go="categories"><b>◫</b>分类</button><button class="tab ${active==='购物车'?'active':''}" data-go="cart"><b>▣</b>购物车</button><button class="tab ${active==='我的'?'active':''}" data-go="me"><b>◯</b>我的</button></nav>`;
    const headerMarkup = (title, search=false) => `<header class="top"><button class="back" data-back aria-label="返回">‹</button>${search?`<label class="search"><span>⌕</span><input placeholder="搜索商品" aria-label="搜索商品" /></label>`:`<h1>${title}</h1>`}<span class="grow"></span>${search?'<button class="icon-btn" aria-label="消息" data-go="notifications">◌</button>':''}</header>`;
