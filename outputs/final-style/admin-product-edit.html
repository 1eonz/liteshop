<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 商品编辑</title><style>
:root{--color-primary:#4ECDC4;--color-primary-strong:#2CB9B0;--color-accent:#FF6B6B;--color-bg:#f5f7f7;--color-surface:#fff;--color-text:#203236;--color-muted:#718083;--color-line:#e6eeee;--color-positive:#52c41a;--color-danger:#ff4d4f;--font-body:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-soft:0 6px 20px rgba(40,80,80,.08);--motion:220ms ease}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:var(--color-surface);border-right:1px solid var(--color-line);padding:var(--space-6) var(--space-4)}.brand{font-size:20px;font-weight:900;color:var(--color-primary-strong);margin-bottom:var(--space-8)}.brand span{color:var(--color-accent)}.nav{display:grid;gap:var(--space-2)}.nav a{padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);color:var(--color-muted);text-decoration:none}.nav a.active,.nav a:hover{background:var(--color-primary);color:var(--color-primary-strong);font-weight:700}.main{max-width:1200px;width:100%;padding:var(--space-6);margin:auto}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)}h1{font-size:26px;margin:0}.subtitle{font-size:14px;color:var(--color-muted);margin:var(--space-1) 0 0}.actions{display:flex;gap:var(--space-2)}.btn{min-height:44px;border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-text);border-radius:999px;padding:0 var(--space-4);font-weight:700}.btn.primary{background:var(--color-primary-strong);border-color:var(--color-primary-strong);color:var(--color-surface)}.btn.danger{color:var(--color-danger);background:transparent;border-color:transparent}.panel{background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-5);box-shadow:var(--shadow-soft);margin-bottom:var(--space-5)}.panel h2{font-size:17px;margin:0 0 var(--space-4)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4) var(--space-6)}.field{display:grid;gap:var(--space-2)}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{min-height:44px;border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);color:var(--color-text);background:var(--color-surface)}.field textarea{min-height:96px;resize:vertical}.hint{color:var(--color-muted);font-size:12px}.upload{display:flex;gap:var(--space-3);align-items:center}.thumb{width:96px;height:96px;object-fit:cover;border-radius:var(--radius-sm);background:var(--color-line)}.upload-btn{min-height:44px;border:1px dashed var(--color-primary-strong);color:var(--color-primary-strong);background:var(--color-primary);border-radius:var(--radius-sm);padding:0 var(--space-3)}.table-wrap{overflow-x:auto}.sku-table{width:100%;min-width:680px;border-collapse:collapse}.sku-table th,.sku-table td{padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-line);text-align:left;font-size:13px;vertical-align:middle}.sku-table th{color:var(--color-muted);font-weight:700}.sku-table input{width:100%;min-height:40px;border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:0 var(--space-2)}.sku-table td:last-child{text-align:right}.remove{min-height:40px;min-width:44px;border:0;background:transparent;color:var(--color-danger);font-size:18px}.add-row{margin-top:var(--space-3);min-height:44px;border:1px dashed var(--color-primary-strong);border-radius:var(--radius-sm);padding:0 var(--space-4);background:var(--color-primary);color:var(--color-primary-strong);font-weight:700}.toast{position:fixed;right:var(--space-6);bottom:var(--space-6);background:var(--color-text);color:var(--color-surface);padding:var(--space-3) var(--space-4);border-radius:999px;opacity:0;transform:translateY(12px);transition:opacity var(--motion),transform var(--motion)}.toast.show{opacity:1;transform:translateY(0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{padding:var(--space-3);border-right:0;border-bottom:1px solid var(--color-line)}.brand{margin:0 0 var(--space-2)}.nav{display:flex;overflow-x:auto}.nav a{white-space:nowrap}.main{padding:var(--space-4)}}@media(max-width:640px){.header{display:block}.actions{margin-top:var(--space-3)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">Lite<span>Shop</span></div><nav class="nav" aria-label="后台导航"><a href="admin-dashboard.html">数据看板</a><a class="active" href="#product">商品管理</a><a href="#orders">订单管理</a><a href="#settings">系统设置</a></nav></aside><main class="main" id="product"><header class="header"><div><h1>编辑商品</h1><p class="subtitle">SPU 基础信息与 SKU 库存</p></div><div class="actions"><button class="btn" onclick="showToast('草稿已保存')">保存草稿</button><button class="btn primary" onclick="saveProduct()">发布商品</button></div></header><form id="productForm" onsubmit="saveProduct(event)"><section class="panel"><h2>SPU 基础信息</h2><div class="form-grid"><div class="field"><label for="name">商品名称</label><input id="name" value="云感轻盈跑鞋" required></div><div class="field"><label for="category">商品分类</label><select id="category"><option>运动鞋服</option><option>生活用品</option><option>个人护理</option></select></div><div class="field"><label for="subtitle">副标题</label><input id="subtitle" value="城市通勤与周末慢跑"></div><div class="field"><label for="price">指导价（元）</label><input id="price" type="number" min="0" step="0.01" value="129.00" required></div><div class="field full"><label for="description">商品描述</label><textarea id="description">轻量缓震中底，透气织物鞋面，适合日常通勤与短途运动。</textarea></div><div class="field full"><label>主图</label><div class="upload"><img class="thumb" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=240&q=80" alt="云感轻盈跑鞋主图" width="96" height="96"><button type="button" class="upload-btn" onclick="showToast('图片选择器已打开')">更换图片</button><span class="hint">建议 1:1，支持 JPG / PNG</span></div></div></div></section><section class="panel"><h2>SKU 规格与库存</h2><div class="table-wrap"><table class="sku-table"><thead><tr><th>规格编码</th><th>颜色</th><th>尺码</th><th>售价（元）</th><th>库存</th><th>操作</th></tr></thead><tbody id="skuBody"><tr><td><input value="SHOE-GREEN-42" aria-label="规格编码"></td><td><input value="雾霾青" aria-label="颜色"></td><td><input value="42" aria-label="尺码"></td><td><input type="number" value="129.00" step="0.01" aria-label="售价"></td><td><input type="number" value="128" min="0" aria-label="库存"></td><td><button type="button" class="remove" aria-label="删除此 SKU" onclick="removeRow(this)">×</button></td></tr><tr><td><input value="SHOE-WHITE-43" aria-label="规格编码"></td><td><input value="奶油白" aria-label="颜色"></td><td><input value="43" aria-label="尺码"></td><td><input type="number" value="129.00" step="0.01" aria-label="售价"></td><td><input type="number" value="96" min="0" aria-label="库存"></td><td><button type="button" class="remove" aria-label="删除此 SKU" onclick="removeRow(this)">×</button></td></tr></tbody></table></div><button type="button" class="add-row" onclick="addRow()">＋ 新增 SKU 行</button></section></form></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function addRow(){const tr=document.createElement('tr');tr.innerHTML='<td><input value="NEW-SKU" aria-label="规格编码"></td><td><input value="" aria-label="颜色"></td><td><input value="" aria-label="尺码"></td><td><input type="number" value="0.00" step="0.01" aria-label="售价"></td><td><input type="number" value="0" min="0" aria-label="库存"></td><td><button type="button" class="remove" aria-label="删除此 SKU" onclick="removeRow(this)">×</button></td>';document.getElementById('skuBody').appendChild(tr);tr.querySelector('input').focus();showToast('已新增 SKU 行')}function removeRow(btn){const rows=document.querySelectorAll('#skuBody tr');if(rows.length<=1){showToast('至少保留一行 SKU');return}btn.closest('tr').remove();showToast('SKU 行已删除')}function saveProduct(e){if(e)e.preventDefault();const b=document.querySelector('.btn.primary');b.disabled=true;b.textContent='发布中…';setTimeout(()=>{b.disabled=false;b.textContent='发布商品';showToast('商品信息已保存')},800)}function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}</script></body></html>
