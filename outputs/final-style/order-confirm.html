<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 订单确认</title><style>
:root{--color-primary:#4ECDC4;--color-primary-strong:#2CB9B0;--color-accent:#FF6B6B;--color-bg:#f5f7f7;--color-surface:#fff;--color-text:#203236;--color-muted:#718083;--color-line:#e6eeee;--font-body:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-soft:0 6px 20px rgba(40,80,80,.08);--motion:220ms ease}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.shell{max-width:520px;margin:auto;padding-bottom:130px}.topbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:rgba(245,247,247,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--color-line)}.topbar h1{font-size:18px;margin:0;flex:1;text-align:center}.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-soft);font-size:20px}.panel{background:var(--color-surface);border-radius:var(--radius-md);margin:var(--space-3) var(--space-4);padding:var(--space-4);box-shadow:var(--shadow-soft)}.panel h2{font-size:16px;margin:0 0 var(--space-3)}.address{display:flex;gap:var(--space-3);align-items:flex-start}.pin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--color-primary);color:var(--color-primary-strong);font-size:20px}.address-main{flex:1}.address-main strong{display:block;font-size:15px}.address-main p{margin:var(--space-1) 0 0;font-size:13px;color:var(--color-muted)}.arrow{color:var(--color-muted);font-size:22px}.item{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--color-line)}.item:first-of-type{border-top:0}.item img{width:76px;height:76px;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);background:var(--color-line)}.item-copy{flex:1}.item-copy h3{font-size:14px;margin:0 0 var(--space-1)}.item-copy p{font-size:12px;color:var(--color-muted);margin:0}.item-row{display:flex;justify-content:space-between;margin-top:var(--space-2);align-items:center}.price{font-family:var(--font-mono);font-weight:800;color:var(--color-accent)}.qty{font-size:13px;color:var(--color-muted)}.line{display:flex;justify-content:space-between;padding:var(--space-2) 0;font-size:14px}.line strong{font-family:var(--font-mono)}.divider{border-top:1px solid var(--color-line);margin-top:var(--space-2);padding-top:var(--space-3)}.note{width:100%;border:1px solid var(--color-line);border-radius:var(--radius-sm);min-height:44px;padding:var(--space-2) var(--space-3);color:var(--color-text);background:var(--color-surface)}.checkout-bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4) max(var(--space-3),env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--color-line)}.checkout-bar span{font-size:14px}.total{font-family:var(--font-mono);font-size:22px;color:var(--color-accent);font-weight:800}.primary{min-height:50px;padding:0 var(--space-6);border-radius:999px;background:var(--color-primary-strong);color:var(--color-inverse);font-weight:800}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(12px);opacity:0;background:var(--color-text);color:var(--color-inverse);padding:var(--space-2) var(--space-4);border-radius:999px;transition:opacity var(--motion),transform var(--motion);z-index:8}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important}}
</style></head><body><main class="shell"><header class="topbar"><button class="icon-btn" aria-label="返回" onclick="history.back()">‹</button><h1>确认订单</h1><button class="icon-btn" aria-label="帮助" onclick="showToast('客服将在 10:00-22:00 在线')">?</button></header><section class="panel"><h2>收货地址</h2><button class="address" aria-label="选择收货地址" onclick="showToast('地址选择器已打开')"><span class="pin">⌖</span><span class="address-main"><strong>林晓雨　138****2088</strong><p>上海市徐汇区漕河泾街道虹梅路 1801 号</p></span><span class="arrow">›</span></button></section><section class="panel"><h2>商品清单</h2><article class="item"><img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=240&q=80" alt="杜蕾斯 Air空气套" width="76" height="76"><div class="item-copy"><h3>杜蕾斯 Air 空气套</h3><p>10只装 · 雾霾青</p><div class="item-row"><span class="price">¥59.00</span><span class="qty">× 1</span></div></div></article><article class="item"><img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=240&q=80" alt="维生素C泡腾片" width="76" height="76"><div class="item-copy"><h3>维生素 C 泡腾片</h3><p>橙味 · 20片装</p><div class="item-row"><span class="price">¥29.90</span><span class="qty">× 1</span></div></div></article></section><section class="panel"><h2>配送与优惠</h2><div class="line"><span>配送方式</span><span>普通快递 · 免运费</span></div><div class="line"><span>优惠券</span><button style="background:transparent;color:var(--color-accent)" onclick="showToast('暂无可用优惠券')">暂无可用 ›</button></div><div class="line"><span>订单备注</span></div><label><span style="position:absolute;width:1px;height:1px;overflow:hidden">订单备注</span><input class="note" placeholder="给商家留言（选填）"></label><div class="line divider"><strong>应付金额</strong><strong class="total">¥88.90</strong></div></section></main><footer class="checkout-bar"><span>合计 <strong class="total">¥88.90</strong></span><button class="primary" onclick="submitOrder()">提交订单</button></footer><div class="toast" id="toast" role="status" aria-live="polite"></div><script>function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function submitOrder(){const b=document.querySelector('.primary');b.disabled=true;b.textContent='提交中…';setTimeout(()=>{b.disabled=false;b.textContent='提交订单';showToast('订单已提交，感谢购买')},900)}</script></body></html>
