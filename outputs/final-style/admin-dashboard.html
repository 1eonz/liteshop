<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 数据看板</title><style>
:root{--color-primary:#4ECDC4;--color-primary-strong:#2CB9B0;--color-accent:#FF6B6B;--color-bg:#f5f7f7;--color-surface:#fff;--color-text:#203236;--color-muted:#718083;--color-line:#e6eeee;--color-positive:#52c41a;--color-primary-soft:rgba(78,205,196,.16);--font-body:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-soft:0 6px 20px rgba(40,80,80,.08);--motion:220ms ease}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:var(--color-surface);border-right:1px solid var(--color-line);padding:var(--space-6) var(--space-4)}.brand{font-weight:900;font-size:20px;color:var(--color-primary-strong);margin-bottom:var(--space-8)}.brand span{color:var(--color-accent)}.nav{display:grid;gap:var(--space-2)}.nav a{padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);color:var(--color-muted);text-decoration:none}.nav a.active,.nav a:hover{background:var(--color-primary);color:var(--color-primary-strong);font-weight:700}.main{padding:var(--space-6);max-width:1440px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6)}h1{font-size:26px;margin:0}.header p{color:var(--color-muted);margin:var(--space-1) 0 0;font-size:14px}.filter{display:flex;gap:var(--space-2);align-items:center}.select{min-height:44px;border:1px solid var(--color-line);background:var(--color-surface);border-radius:var(--radius-sm);padding:0 var(--space-3);color:var(--color-text)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4);margin-bottom:var(--space-5)}.metric{background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-5);box-shadow:var(--shadow-soft);border-top:3px solid var(--color-primary)}.metric:nth-child(2){border-top-color:var(--color-accent)}.metric:nth-child(3){border-top-color:var(--color-positive)}.metric:nth-child(4){border-top-color:var(--color-primary-strong)}.metric-label{font-size:13px;color:var(--color-muted)}.metric-value{font-family:var(--font-mono);font-size:30px;font-weight:800;margin:var(--space-2) 0}.trend{font-size:12px;color:var(--color-positive)}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.95fr);gap:var(--space-5)}.panel{background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-5);box-shadow:var(--shadow-soft)}.panel h2{font-size:17px;margin:0 0 var(--space-4)}.chart-wrap{position:relative;height:300px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-line{fill:none;stroke:var(--color-primary-strong);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart-area{fill:var(--color-primary-soft)}.chart-grid{stroke:var(--color-line);stroke-width:1}.point{fill:var(--color-surface);stroke:var(--color-accent);stroke-width:3;cursor:pointer}.point:hover{fill:var(--color-accent)}.chart-tip{position:absolute;display:none;background:var(--color-text);color:var(--color-surface);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:12px;pointer-events:none}.chart-tip.show{display:block}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{text-align:left;padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--color-line);font-size:13px}.rank th{color:var(--color-muted);font-weight:600}.rank td:last-child{text-align:right;font-family:var(--font-mono)}.bar{height:6px;background:var(--color-primary);border-radius:999px;margin-top:var(--space-1);overflow:hidden}.bar span{display:block;height:100%;background:var(--color-primary-strong);border-radius:inherit}.toast{position:fixed;right:var(--space-6);bottom:var(--space-6);background:var(--color-text);color:var(--color-surface);padding:var(--space-3) var(--space-4);border-radius:999px;opacity:0;transform:translateY(12px);transition:opacity var(--motion),transform var(--motion)}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{padding:var(--space-3);border-right:0;border-bottom:1px solid var(--color-line)}.brand{margin:0 0 var(--space-2)}.nav{display:flex;overflow-x:auto}.nav a{white-space:nowrap}.main{padding:var(--space-4)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}@media(max-width:520px){.header{display:block}.filter{margin-top:var(--space-3)}.cards{grid-template-columns:1fr 1fr}.metric{padding:var(--space-3)}.metric-value{font-size:24px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">Lite<span>Shop</span></div><nav class="nav" aria-label="后台导航"><a class="active" href="#dashboard">数据看板</a><a href="admin-product-edit.html">商品管理</a><a href="#orders">订单管理</a><a href="#settings">系统设置</a></nav></aside><main class="main" id="dashboard"><header class="header"><div><h1>经营概览</h1><p>今天的经营节奏，一眼掌握</p></div><div class="filter"><label for="range" style="position:absolute;width:1px;height:1px;overflow:hidden">统计周期</label><select class="select" id="range" onchange="showToast('已切换至'+this.value)"><option>近 7 天</option><option>近 30 天</option><option>本季度</option></select></div></header><section class="cards" aria-label="关键指标"><article class="metric"><div class="metric-label">成交金额</div><div class="metric-value">¥128,420</div><div class="trend">↑ 12.8% 较上周</div></article><article class="metric"><div class="metric-label">支付订单</div><div class="metric-value">2,846</div><div class="trend">↑ 8.4% 较上周</div></article><article class="metric"><div class="metric-label">新增用户</div><div class="metric-value">1,208</div><div class="trend">↑ 16.2% 较上周</div></article><article class="metric"><div class="metric-label">客单价</div><div class="metric-value">¥45.12</div><div class="trend">↑ 3.1% 较上周</div></article></section><section class="grid"><article class="panel"><h2>成交趋势</h2><div class="chart-wrap"><div class="chart-tip" id="tip"></div><svg viewBox="0 0 720 300" role="img" aria-label="近七日成交金额折线图"><line class="chart-grid" x1="0" y1="40" x2="720" y2="40"></line><line class="chart-grid" x1="0" y1="120" x2="720" y2="120"></line><line class="chart-grid" x1="0" y1="200" x2="720" y2="200"></line><path class="chart-area" d="M20 232 L130 190 L240 210 L350 132 L460 160 L570 84 L680 106 L680 260 L20 260 Z"></path><path class="chart-line" d="M20 232 L130 190 L240 210 L350 132 L460 160 L570 84 L680 106"></path><g class="points"><circle class="point" cx="20" cy="232" r="6" data-label="周一 ¥14,200"></circle><circle class="point" cx="130" cy="190" r="6" data-label="周二 ¥17,800"></circle><circle class="point" cx="240" cy="210" r="6" data-label="周三 ¥16,300"></circle><circle class="point" cx="350" cy="132" r="6" data-label="周四 ¥22,100"></circle><circle class="point" cx="460" cy="160" r="6" data-label="周五 ¥19,600"></circle><circle class="point" cx="570" cy="84" r="6" data-label="周六 ¥26,500"></circle><circle class="point" cx="680" cy="106" r="6" data-label="周日 ¥24,900"></circle></g></svg></div></article><article class="panel"><h2>商品排行</h2><table class="rank"><thead><tr><th>商品</th><th>销量</th></tr></thead><tbody><tr><td>杜蕾斯 Air 空气套<div class="bar"><span style="width:92%"></span></div></td><td>1,286</td></tr><tr><td>维生素 C 泡腾片<div class="bar"><span style="width:74%"></span></div></td><td>936</td></tr><tr><td>云感轻盈跑鞋<div class="bar"><span style="width:58%"></span></div></td><td>724</td></tr><tr><td>便携保温杯<div class="bar"><span style="width:43%"></span></div></td><td>512</td></tr></tbody></table></article></section></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const tip=document.getElementById('tip');document.querySelectorAll('.point').forEach(p=>{p.addEventListener('mouseenter',e=>{tip.textContent=p.dataset.label;tip.style.left=(p.cx.baseVal.value/720*100)+'%';tip.style.top=(p.cy.baseVal.value/300*100-14)+'%';tip.classList.add('show')});p.addEventListener('mouseleave',()=>tip.classList.remove('show'))});function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}</script></body></html>
