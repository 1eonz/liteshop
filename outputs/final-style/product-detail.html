<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiteShop 商品详情</title>
<style>
:root{--color-primary:#4ECDC4;--color-primary-strong:#2CB9B0;--color-accent:#FF6B6B;--color-bg:#f5f7f7;--color-surface:#fff;--color-text:#203236;--color-muted:#718083;--color-line:#e6eeee;--color-inverse:#fff;--font-body:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-soft:0 6px 20px rgba(40,80,80,.08);--shadow-sheet:0 -14px 36px rgba(31,61,61,.18);--motion:220ms ease}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);line-height:1.5}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.shell{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:rgba(245,247,247,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(230,238,238,.8)}.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--color-surface);color:var(--color-text);font-size:20px;box-shadow:var(--shadow-soft)}.topbar h1{font-size:18px;margin:0;flex:1;text-align:center}.hero{position:relative;aspect-ratio:1/1;background:var(--color-line);overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;display:block}.hero-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:var(--space-3)}.hero-nav button{background:rgba(255,255,255,.76);color:var(--color-text)}.dots{position:absolute;bottom:var(--space-3);left:0;right:0;display:flex;justify-content:center;gap:var(--space-2)}.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.64)}.dot.active{background:var(--color-primary-strong);width:22px;border-radius:99px}.panel{background:var(--color-surface);border-radius:var(--radius-md);margin:var(--space-3) var(--space-4);padding:var(--space-4);box-shadow:var(--shadow-soft)}.price-line{display:flex;align-items:baseline;gap:var(--space-2)}.price{font-family:var(--font-mono);font-size:30px;font-weight:800;color:var(--color-accent)}.old-price{color:var(--color-muted);text-decoration:line-through;font-size:13px}.tag{display:inline-block;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);background:var(--color-primary);color:var(--color-primary-strong);font-size:12px;font-weight:700}.product-title{font-size:18px;line-height:1.35;margin:var(--space-2) 0}.meta{font-size:13px;color:var(--color-muted)}.row{display:flex;align-items:center;gap:var(--space-3)}.between{justify-content:space-between}.section-title{font-size:16px;margin:0 0 var(--space-3)}.choice{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-top:1px solid var(--color-line);font-size:14px}.choice button{background:transparent;color:var(--color-muted);padding:var(--space-2)}.detail-image{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-sm);margin-top:var(--space-3)}.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);padding-bottom:max(var(--space-3),env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--color-line);z-index:5}.bottom-bar .secondary{flex:1;background:var(--color-primary);color:var(--color-primary-strong)}.primary{flex:1.5;background:var(--color-primary-strong);color:var(--color-inverse)}.action{min-height:48px;border-radius:999px;font-weight:800;padding:0 var(--space-5)}.scrim{position:fixed;inset:0;background:rgba(32,50,54,.44);z-index:8;opacity:0;pointer-events:none;transition:opacity var(--motion)}.scrim.open{opacity:1;pointer-events:auto}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(520px,100%);background:var(--color-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-5) var(--space-4) max(var(--space-5),env(safe-area-inset-bottom));z-index:9;box-shadow:var(--shadow-sheet);transition:transform var(--motion)}.sheet.open{transform:translate(-50%,0)}.sheet-handle{width:42px;height:4px;background:var(--color-line);border-radius:99px;margin:0 auto var(--space-4)}.swatches{display:flex;gap:var(--space-2);flex-wrap:wrap}.swatch{min-height:44px;padding:0 var(--space-3);border:1px solid var(--color-line);border-radius:999px;background:var(--color-surface)}.swatch.selected{border-color:var(--color-primary-strong);color:var(--color-primary-strong);background:var(--color-primary)}.sheet-footer{display:flex;gap:var(--space-3);margin-top:var(--space-6)}.sheet-footer button{flex:1;min-height:50px;border-radius:999px;font-weight:800}.confirm{background:var(--color-primary-strong);color:var(--color-inverse)}.close{background:var(--color-line);color:var(--color-text)}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:var(--color-text);color:var(--color-inverse);padding:var(--space-2) var(--space-4);border-radius:999px;opacity:0;pointer-events:none;transition:opacity var(--motion),transform var(--motion);z-index:12}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.shell{background:var(--color-bg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:1ms!important;animation-duration:1ms!important}}
</style></head>
<body><main class="shell">
<header class="topbar"><button class="icon-btn" aria-label="返回" onclick="history.back()">‹</button><h1>商品详情</h1><button class="icon-btn" aria-label="分享" onclick="showToast('链接已复制')">↗</button></header>
<section class="hero" aria-label="商品图片轮播"><img id="heroImage" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85" alt="轻盈跑鞋商品图"><div class="hero-nav"><button class="icon-btn" aria-label="上一张" onclick="changeSlide(-1)">‹</button><button class="icon-btn" aria-label="下一张" onclick="changeSlide(1)">›</button></div><div class="dots" id="dots" aria-label="轮播进度"></div></section>
<section class="panel"><div class="price-line"><strong class="price">¥129.00</strong><span class="old-price">¥199.00</span><span class="tag">限时特惠</span></div><h2 class="product-title">云感轻盈跑鞋｜城市通勤与周末慢跑</h2><p class="meta">已售 2,348 · 4.9 分 · 免运费</p></section>
<section class="panel"><h2 class="section-title">选择规格</h2><div class="choice"><span>颜色</span><button onclick="openSheet()" id="colorChoice">雾霾青　›</button></div><div class="choice"><span>尺码</span><button onclick="openSheet()" id="sizeChoice">42　›</button></div></section>
<section class="panel"><div class="row between"><h2 class="section-title">商品详情</h2><span class="meta">品质承诺</span></div><p class="meta">轻量缓震中底，透气织物鞋面，适合日常通勤与短途运动。图片为实物拍摄，颜色因屏幕略有差异。</p><img class="detail-image" src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=85" alt="跑鞋鞋面细节"><img class="detail-image" src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=900&q=85" alt="跑鞋穿着场景"></section>
</main><nav class="bottom-bar" aria-label="商品操作"><button class="action secondary" onclick="showToast('已加入购物车')">加入购物车</button><button class="action primary" onclick="openSheet()">立即购买</button></nav>
<div class="scrim" id="scrim" onclick="closeSheet()"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><div class="row between"><h2 id="sheetTitle" class="section-title">选择规格</h2><button class="icon-btn" aria-label="关闭规格抽屉" onclick="closeSheet()">×</button></div><p class="meta">云感轻盈跑鞋 · ¥129.00</p><h3 class="section-title">颜色</h3><div class="swatches" id="colors"><button class="swatch selected" onclick="selectOption(this,'color')">雾霾青</button><button class="swatch" onclick="selectOption(this,'color')">奶油白</button><button class="swatch" onclick="selectOption(this,'color')">曜石黑</button></div><h3 class="section-title" style="margin-top:var(--space-5)">尺码</h3><div class="swatches" id="sizes"><button class="swatch selected" onclick="selectOption(this,'size')">42</button><button class="swatch" onclick="selectOption(this,'size')">43</button><button class="swatch" onclick="selectOption(this,'size')">44</button></div><div class="sheet-footer"><button class="close" onclick="closeSheet()">取消</button><button class="confirm" onclick="confirmSku()">确认并加入</button></div></section><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const slides=['https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1460353581641-37baddab0fa2?auto=format&fit=crop&w=900&q=85','https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=85'];let index=0;const image=document.getElementById('heroImage');const dots=document.getElementById('dots');slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===0?' active':'');b.setAttribute('aria-label','第'+(i+1)+'张');b.onclick=()=>{index=i;renderSlide()};dots.appendChild(b)});function renderSlide(){image.src=slides[index];dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===index))}function changeSlide(step){index=(index+step+slides.length)%slides.length;renderSlide()}function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('scrim').classList.add('open')}function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('scrim').classList.remove('open')}function selectOption(button,type){button.parentElement.querySelectorAll('.swatch').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');if(type==='color')document.getElementById('colorChoice').textContent=button.textContent+'　›';else document.getElementById('sizeChoice').textContent=button.textContent+'　›'}function confirmSku(){closeSheet();showToast('已加入购物车')}function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script></body></html>
