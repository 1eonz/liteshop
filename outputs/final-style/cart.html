<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 购物车</title><style>
:root{--color-primary:#4ECDC4;--color-primary-strong:#2CB9B0;--color-accent:#FF6B6B;--color-bg:#f5f7f7;--color-surface:#fff;--color-text:#203236;--color-muted:#718083;--color-line:#e6eeee;--font-body:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-soft:0 6px 20px rgba(40,80,80,.08);--motion:220ms ease}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.shell{max-width:520px;margin:auto;min-height:100vh;padding-bottom:150px}.topbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:rgba(245,247,247,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--color-line)}.topbar h1{font-size:18px;margin:0;flex:1;text-align:center}.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-soft);font-size:20px}.edit{background:transparent;box-shadow:none;font-size:14px;color:var(--color-primary-strong);font-weight:700}.select-all{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4);font-size:14px}.check{width:24px;height:24px;border:2px solid var(--color-line);border-radius:50%;display:grid;place-items:center;color:var(--color-surface);flex:none}.check.checked{background:var(--color-primary-strong);border-color:var(--color-primary-strong)}.check.checked::after{content:'✓';font-size:14px}.cart-list{display:grid;gap:var(--space-3);padding:0 var(--space-4)}.cart-item{display:grid;grid-template-columns:24px 88px 1fr;gap:var(--space-3);align-items:center;background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-3);box-shadow:var(--shadow-soft)}.cart-item img{width:88px;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);background:var(--color-line)}.name{font-size:14px;font-weight:700;margin:0 0 var(--space-1)}.spec{font-size:12px;color:var(--color-muted);margin:0 0 var(--space-2)}.price{font-family:var(--font-mono);font-size:17px;font-weight:800;color:var(--color-accent)}.item-main{min-width:0}.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}.stepper{display:flex;align-items:center;border:1px solid var(--color-line);border-radius:999px;overflow:hidden}.stepper button{width:36px;height:36px;background:var(--color-surface);color:var(--color-primary-strong);font-size:18px}.qty{min-width:30px;text-align:center;font-family:var(--font-mono);font-size:14px}.empty{margin:var(--space-8) var(--space-4);padding:var(--space-8) var(--space-4);background:var(--color-surface);border-radius:var(--radius-md);text-align:center;color:var(--color-muted)}.summary{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);padding:var(--space-3) var(--space-4) max(var(--space-3),env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--color-line);z-index:4}.summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);font-size:14px}.total{font-family:var(--font-mono);font-size:22px;font-weight:800;color:var(--color-accent)}.primary{width:100%;min-height:50px;border-radius:999px;background:var(--color-primary-strong);color:var(--color-inverse);font-weight:800}.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(12px);opacity:0;background:var(--color-text);color:var(--color-inverse);padding:var(--space-2) var(--space-4);border-radius:999px;transition:opacity var(--motion),transform var(--motion);z-index:8}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important}}@media(min-width:700px){.shell{padding-top:var(--space-4)}}
</style></head><body><main class="shell"><header class="topbar"><button class="icon-btn" aria-label="返回" onclick="history.back()">‹</button><h1>购物车 <span id="countLabel">2</span></h1><button class="icon-btn edit" onclick="showToast('编辑模式已开启')">编辑</button></header><label class="select-all"><button class="check checked" id="checkAll" aria-label="全选购物车" aria-pressed="true" onclick="toggleAll()"></button><span>全选</span></label><section class="cart-list" id="cartList" aria-label="购物车商品"><article class="cart-item" data-price="59" data-qty="1"><button class="check checked item-check" aria-label="选择杜蕾斯 Air空气套" aria-pressed="true" onclick="toggleItem(this)"></button><img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=240&q=80" alt="杜蕾斯 Air空气套" width="88" height="88"><div class="item-main"><p class="name">杜蕾斯 Air 空气套</p><p class="spec">10只装 · 轻薄款</p><div class="item-bottom"><strong class="price">¥59.00</strong><div class="stepper" aria-label="数量"><button aria-label="减少数量" onclick="changeQty(this,-1)">−</button><span class="qty">1</span><button aria-label="增加数量" onclick="changeQty(this,1)">＋</button></div></div></div></article><article class="cart-item" data-price="29.9" data-qty="1"><button class="check checked item-check" aria-label="选择维生素C泡腾片" aria-pressed="true" onclick="toggleItem(this)"></button><img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=240&q=80" alt="维生素C泡腾片" width="88" height="88"><div class="item-main"><p class="name">维生素 C 泡腾片</p><p class="spec">橙味 · 20片装</p><div class="item-bottom"><strong class="price">¥29.90</strong><div class="stepper" aria-label="数量"><button aria-label="减少数量" onclick="changeQty(this,-1)">−</button><span class="qty">1</span><button aria-label="增加数量" onclick="changeQty(this,1)">＋</button></div></div></div></article></section></main><section class="summary" aria-label="购物车结算"><div class="summary-row"><span>已选 <b id="selectedCount">2</b> 件</span><span>合计 <strong class="total" id="total">¥88.90</strong></span></div><button class="primary" onclick="checkout()">去结算</button></section><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
function selectedItems(){return [...document.querySelectorAll('.cart-item')].filter(i=>i.querySelector('.item-check').classList.contains('checked'))}function refresh(){let total=0,count=0;selectedItems().forEach(i=>{const qty=+i.dataset.qty;total+=+i.dataset.price*qty;count+=qty});document.getElementById('total').textContent='¥'+total.toFixed(2);document.getElementById('selectedCount').textContent=count;document.getElementById('countLabel').textContent=document.querySelectorAll('.cart-item').length;const all=[...document.querySelectorAll('.item-check')].every(b=>b.classList.contains('checked'));document.getElementById('checkAll').classList.toggle('checked',all);document.getElementById('checkAll').setAttribute('aria-pressed',all)}function toggleItem(btn){btn.classList.toggle('checked');btn.setAttribute('aria-pressed',btn.classList.contains('checked'));refresh()}function toggleAll(){const all=document.getElementById('checkAll').classList.contains('checked');document.querySelectorAll('.item-check').forEach(b=>{b.classList.toggle('checked',!all);b.setAttribute('aria-pressed',!all)});refresh()}function changeQty(btn,delta){const item=btn.closest('.cart-item');let qty=Math.max(1,+item.dataset.qty+delta);item.dataset.qty=qty;btn.parentElement.querySelector('.qty').textContent=qty;refresh()}function checkout(){if(!selectedItems().length){showToast('请先选择商品');return}showToast('正在前往结算');setTimeout(()=>location.href='order-confirm.html',650)}function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script></body></html>
