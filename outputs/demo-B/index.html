d{font-size:var(--font-size-xs)}.promo{position:relative;overflow:hidden;border:1px solid var(--color-border-base);border-radius:var(--radius-md);background:var(--color-primary-700);color:var(--color-text-inverse);min-height:122px}.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}.promo-copy{position:relative;padding:var(--spacing-5);max-width:72%}.promo h2{margin:0 0 var(--spacing-1);font-size:var(--font-size-xl)}.promo p{margin:0;font-size:var(--font-size-sm)}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-3)}.product-card{overflow:hidden;background:var(--color-bg-card);border:1px solid var(--color-border-base);border-radius:var(--radius-base);box-shadow:var(--shadow-sm)}.product-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.product-info{padding:var(--spacing-3)}.product-title{margin:0 0 var(--spacing-2);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{margin:0;color:var(--color-primary-700);font-family:var(--font-family-number);font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}.price small{font-size:var(--font-size-xs);font-weight:var(--font-weight-normal)}.sales{margin:var(--spacing-1) 0 0;color:var(--color-text-tertiary);font-size:var(--font-size-xs)}.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:6;height:calc(var(--h5-tabbar-height) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--color-tabbar-bg);border-top:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(4,1fr)}.tabbar a{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--color-text-tertiary);font-size:10px;text-decoration:none}.tabbar a[aria-current="page"]{color:var(--color-primary-700);font-weight:var(--font-weight-semibold)}.tab-i <body data-app="h5"><a class="skip-link" href="#main-content">跳到主要内容</a><div class="page-shell"><header class="glass-header" aria-label="顶部搜索"><form class="search-form" role="search" id="search-form"><span aria-hidden="true">⌕</span><label class="sr-only" for="site-search">搜索商品</label><input id="site-search" type="search" placeholder="搜索商品、品牌或型号" autocomplete="off"><button type="submit">搜索</button></form><p class="status" id="search-status" role="status" aria-live="polite"></p></header><main id="main-content">
  <section class="hero" aria-label="精选活动轮播"><div class="carousel" aria-roledescription="轮播图" aria-label="精选活动"><article class="slide active" data-slide><div class="slide-copy"><p class="text-xs uppercase tracking-widest" style="color:var(--color-primary-700)">BUSINESS PICKS</p><h1>可信赖的日常采购清单</h1><p>严选品牌与稳定供应，今天下单明日发货。</p></div><img class="slide-art" src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=240&q=80" alt="办公用品精选"></article><article class="slide" data-slide><div class="slide-copy"><p class="text-xs uppercase tracking-widest" style="color:var(--color-primary-700)">QUALITY FIRST</p><h1>每一件都经得起比较</h1><p>透明参数，安心售后，选购更高效。</p></div><img class="slide-art" src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=240&q=80" alt="品质办公空间"></article><button class="carousel-control prev" type="button" aria-label="上一张">‹</button><button class="carousel-control next" type="button" aria-label="下一张">›</button><div class="dots" role="tablist" aria-label="轮播图分页"><button class="dot active" type="button" role="tab" aria-label="第 1 张" aria-selected="true"></button><button class="dot" type="button" role="tab" aria-label="第 2 张" aria-selected="false"></button></div></div></section>

  <script>(()=>{const slides=[...document.querySelectorAll('[data-slide]')],dots=[...document.querySelectorAll('.dot')];let index=0;const render=next=>{index=(next+slides.length)%slides.length;slides.forEach((e,i)=>e.classList.toggle('active',i===index));dots.forEach((e,i)=>{e.classList.toggle('active',i===index);e.setAttribute('aria-selected',String(i===index));})};document.querySelector('.prev').onclick=()=>render(index-1);document.querySelector('.next').onclick=()=>render(index+1);dots.forEach((e,i)=>e.onclick=()=>render(i));document.getElementById('search-form').onsubmit=e=>{e.preventDefault();const v=document.getElementById('site-search').value.trim();document.getElementById('search-status').textContent=v?`正在为你查找“${v}”`:'请输入商品关键词'};})();</script>
